name: SoundBase
options:
  bundleIdPrefix: com.lunero
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
packages:
  GTMSessionFetcher:
    url: https://github.com/google/gtm-session-fetcher
    from: "5.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 225KXPVW4C
targets:
  SoundBase:
    type: application
    platform: iOS
    sources:
      - SoundBase
      - Shared
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleCastCoreResources.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleCastUIResources.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleCastOptionalUIResources.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleSansBold.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleSansMedium.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/GoogleSansRegular.bundle
        buildPhase: resources
      - path: Vendor/GoogleCast.xcframework/ios-arm64/GoogleCast.framework/MaterialDialogs.bundle
        buildPhase: resources
    info:
      path: SoundBase/Info.plist
      properties:
        CFBundleDisplayName: SoundBase
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: SoundBase looks for Chromecast and Google TV devices on your network so you can cast music to them.
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunero.SoundBase
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-lc++"]
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Red AppIcon-Orange AppIcon-Amber AppIcon-Green AppIcon-Mint AppIcon-Teal AppIcon-Blue AppIcon-Indigo AppIcon-Purple AppIcon-Graphite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
    dependencies:
      - target: SoundBaseWatch
      - framework: Vendor/GoogleCast.xcframework
        embed: false
      - package: GTMSessionFetcher
        product: GTMSessionFetcherCore
  SoundBaseWatch:
    type: application
    platform: watchOS
    sources: [SoundBaseWatch, Shared]
    info:
      path: SoundBaseWatch/Info.plist
      properties:
        CFBundleDisplayName: SoundBase
        WKApplication: true
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: com.lunero.SoundBase
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunero.SoundBase.watchkitapp
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SoundBaseMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - SoundBaseMac
      - Shared
      - SoundBase/App/AppModel.swift
      - SoundBase/Player/Player.swift
      - SoundBase/Player/DownloadManager.swift
      - SoundBase/Support/Support.swift
    info:
      path: SoundBaseMac/Info.plist
      properties:
        CFBundleDisplayName: SoundBase
        CFBundleName: SoundBase
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: SoundBase
        PRODUCT_BUNDLE_IDENTIFIER: com.lunero.SoundBase
        CODE_SIGN_ENTITLEMENTS: SoundBaseMac/SoundBaseMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
